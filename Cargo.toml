[package]
name = "rp2350-touch"
version = "0.1.0"
edition = "2024"

[dependencies]
rp235x-hal = { version = "0.4.0", features = ["rt", "critical-section-impl"] }
cortex-m-rt = "0.7"
panic-halt = "0.2"
embedded-hal = "1.0.0"
embedded-graphics = "0.8"
cortex-m = "0.7.7"
pio-proc = "0.3"
pio = "0.3"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"